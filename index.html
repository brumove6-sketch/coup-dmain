<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup d'Main — Dashboard Pro</title>
    <style>
        .airtable-widget {
            --gold: #C9A84C; --navy: #080C16; --text: #E2DCD4;
            --bg-card: #0F1623; --border: #1A2438;
            font-family: sans-serif; color: var(--text);
        }
        .airtable-widget .form-card { 
            background: var(--bg-card); border: 1px solid var(--border); 
            padding: 2rem; border-radius: 8px; max-width: 800px; margin: auto; 
        }
        .airtable-widget .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
        .airtable-widget label { display: block; margin-bottom: 5px; color: #64748B; font-size: 0.8rem; text-transform: uppercase; }
        .airtable-widget input, .airtable-widget select, .airtable-widget textarea { 
            width: 100%; padding: 10px; background: var(--navy); border: 1px solid #222E45; 
            color: white; border-radius: 4px; box-sizing: border-box;
        }
        .airtable-widget .btn-primary { 
            background: var(--gold); color: black; border: none; padding: 15px 30px; 
            cursor: pointer; font-weight: bold; margin-top: 20px; width: 100%; border-radius: 4px;
        }
        .airtable-widget .full { grid-column: 1 / -1; }
    </style>
</head>
<body>

<div class="airtable-widget">
    <div class="form-card">
        <h2 style="color: var(--gold); margin-top: 0;">Nouvelle Mission — Prospects</h2>
        <form id="prospect-form">
            <div class="form-grid">
                <div><label>Nom du client</label><input type="text" id="nom" required></div>
                <div><label>Contact</label><input type="text" id="contact" required></div>
                <div>
                    <label>Métier / Spécialité</label>
                    <select id="metier">
                        <option>Plomberie</option><option>Électricité</option>
                        <option>Cuisine</option><option>Autre</option>
                    </select>
                </div>
                <div><label>Secteur / Ville</label><input type="text" id="secteur"></div>
                <div><label>Date</label><input type="date" id="date"></div>
                <div><label>Budget estimé</label><input type="text" id="budget"></div>
                <div class="full">
                    <label>Description</label>
                    <textarea id="desc" rows="4"></textarea>
                </div>
            </div>
            <button type="submit" class="btn-primary" id="submit-btn">ENREGISTRER LA MISSION</button>
        </form>
    </div>
</div>

<script>
const BASE_ID = 'apptgHQc8PSNBEl9x'; 
const API_KEY = 'patlc8qJlwI6o0ENF'; 

document.getElementById('prospect-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submit-btn');
    btn.disabled = true;
    btn.innerText = 'Synchronisation...';

    const fields = {
        "Nom du client": document.getElementById('nom').value,
        "Contact": document.getElementById('contact').value,
        "Métier / Spécialité": document.getElementById('metier').value,
        "Secteur / Ville": document.getElementById('secteur').value,
        "Date": document.getElementById('date').value,
        "Budget estimé": document.getElementById('budget').value,
        "Description": document.getElementById('desc').value,
        "Statut": "Nouveau",
        "IA_Arbitrage": "En attente"
    };

    try {
        const response = await fetch(`https://api.airtable.com/v0/${BASE_ID}/Prospects`, {
            method: 'POST',
            headers: {
                'Authorization': `Bearer ${API_KEY}`,
                'Content-Type': 'application/json'
            },
            body: JSON.stringify({ records: [ { fields: fields } ] })
        });

        if (response.ok) {
            alert("Succès ! La mission a été enregistrée.");
            document.getElementById('prospect-form').reset();
        } else {
            const err = await response.json();
            alert("Erreur : " + JSON.stringify(err.error));
        }
    } catch (error) {
        alert("Erreur réseau.");
    } finally {
        btn.disabled = false;
        btn.innerText = 'ENREGISTRER LA MISSION';
    }
});
</script>

</body>
</html>
