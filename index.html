<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coup d'Main — Système Souverain</title>
    <style>
        :root { --gold: #C9A84C; --navy: #080C16; --bg: #05070A; --card: #0F1623; --text: #E2DCD4; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; }
        nav { background: var(--navy); padding: 15px; display: flex; justify-content: center; gap: 30px; border-bottom: 1px solid var(--gold); position: sticky; top: 0; }
        nav a { color: var(--gold); text-decoration: none; font-weight: bold; cursor: pointer; text-transform: uppercase; font-size: 0.9rem; }
        .container { max-width: 1200px; margin: auto; padding: 20px; }
        .section { display: none; }
        .active { display: block; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: var(--card); border: 1px solid #1A2438; padding: 20px; border-radius: 12px; border-left: 5px solid var(--gold); }
        .wa-btn { background: #25D366; color: white; text-align: center; text-decoration: none; display: block; padding: 12px; border-radius: 6px; margin-top: 15px; font-weight: bold; }
        .badge { background: #1A2438; color: var(--gold); padding: 4px 8px; border-radius: 4px; font-size: 0.7rem; float: right; }
    </style>
</head>
<body>

<nav>
    <a onclick="show('prospects')">Missions (Prospects)</a>
    <a onclick="show('artisans')">Répertoire Artisans</a>
</nav>

<div class="container">
    <div id="prospects" class="section active">
        <h1 style="color: var(--gold)">Flux des Missions</h1>
        <div id="data-prospects" class="grid">Synchronisation Airtable...</div>
    </div>

    <div id="artisans" class="section">
        <h1 style="color: var(--gold)">Base Artisans Qualifiés</h1>
        <div id="data-artisans" class="grid">Synchronisation Airtable...</div>
    </div>
</div>

<script>
const API = {
    base: 'apptgHQc8PSNBEl9x',
    key: 'patlc8qJlwI6o0ENF'
};

function show(id) {
    document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
    document.getElementById(id).classList.add('active');
    load(id === 'prospects' ? 'Prospects' : 'Artisans', id === 'prospects' ? 'data-prospects' : 'data-artisans');
}

async function load(table, targetId) {
    const container = document.getElementById(targetId);
    try {
        const response = await fetch(`https://api.airtable.com/v0/${API.base}/${table}`, {
            headers: { Authorization: `Bearer ${API.key}` }
        });
        const data = await response.json();
        render(data.records, container, table);
    } catch (e) { container.innerHTML = "Erreur de connexion Airtable."; }
}

function render(records, container, table) {
    container.innerHTML = '';
    records.forEach(r => {
        const f = r.fields;
        const div = document.createElement('div');
        div.className = 'card';
        
        if(table === 'Prospects') {
            div.innerHTML = `
                <span class="badge">${f["Statut"] || 'Nouveau'}</span>
                <h3>${f["Nom du client"] || 'Client'}</h3>
                <p>${f["Métier / Spécialité"] || ''} - ${f["Secteur / Ville"] || ''}</p>
                <a href="https://wa.me/${f["Contact"]}" class="wa-btn">CONTACTER WHATSAPP</a>`;
        } else {
            div.innerHTML = `
                <h3>${f["Nom"] || 'Artisan'}</h3>
                <p><strong>Spécialité:</strong> ${f["Spécialité"] || ''}</p>
                <a href="https://wa.me/${f["Téléphone"]}" class="wa-btn">APPELER PRESTATAIRE</a>`;
        }
        container.appendChild(div);
    });
}

// Lancement automatique au démarrage
load('Prospects', 'data-prospects');
</script>
</body>
</html>
